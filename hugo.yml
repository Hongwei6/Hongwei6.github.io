# ===========================================================================
# Hugo + PaperMod 主题配置
# 主题: https://github.com/adityatelange/hugo-PaperMod
# ===========================================================================
baseURL: "https://hongwei6.github.io/"
languageCode: "zh"
defaultContentLanguage: "zh"
title: "Hongwei's Blog"
theme: ["PaperMod"]

pagination:
  pagerSize: 10

enableRobotsTXT: true
enableEmoji: true
enableGitInfo: true        # 文章自动带 git 最后修改时间

# ===========================================================================
# Markdown / 代码高亮
# ===========================================================================
markup:
  goldmark:
    renderer:
      unsafe: true         # 允许文章内嵌原生 HTML
  highlight:
    noClasses: false
    # codeFences: true
    # style: "monokai"    # 不指定 style 时跟随明暗主题

# ===========================================================================
# 顶部导航
# ===========================================================================
menu:
  main:
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 1
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 2
    - identifier: categories
      name: 分类
      url: /categories/
      weight: 3
    - identifier: github
      name: GitHub
      url: https://github.com/Hongwei6
      weight: 4

# ===========================================================================
# 主题参数
# ===========================================================================
params:
  env: production
  defaultTheme: auto                # 跟随系统明暗
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowToc: true
  TocOpen: false
  UseHugoToc: true
  disableThemeToggle: false
  hideMeta: false
  hideSummary: false
  showtoc: true

  # 首页 = Profile 卡片 + 最新文章列表
  profileMode:
    enabled: true
    title: "Hongwei's Blog"
    subtitle: "👋 你好,我是 Hongwei · 记录编程、学习与思考"
    imageUrl: ""
    imageTitle: ""
    buttons:
      - name: 文章
        url: /posts/
      - name: 标签
        url: /tags/

  # 首页下方显示最新文章
  mainSections:
    - posts

  # 社交链接(显示在 Profile 卡片)
  socialIcons:
    - name: github
      url: "https://github.com/Hongwei6"
    - name: rss
      url: "/index.xml"

  # 文章页封面(自动)
  cover:
    hidden: true
    hiddenInList: true
    hiddenInSingle: true

  editPost:
    URL: ""
    Text: ""
    appendFilePath: false

  # SEO
  assets:
    disableHLJS: true             # 用 Hugo 内置 highlight
  label:
    text: "Hongwei's Blog"
    icon: ""
  # 搜索
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

outputs:
  home:
    - HTML
    - RSS
    - JSON            # 供 PaperMod 全文搜索使用

# ===========================================================================
# 站点元信息
# ===========================================================================
author: ["Hongwei"]
pygmentsUseClasses: true
