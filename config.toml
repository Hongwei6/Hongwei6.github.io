# ===========================================================================
# Hugo + Terminal 主题配置(单文件)
# 主题: https://github.com/panr/hugo-theme-terminal
# ===========================================================================
baseurl = "https://hongwei6.github.io/"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
theme = "terminal"
enableRobotsTXT = true
summaryLength = 30

[pagination]
  pagerSize = 10

# 代码高亮:Terminal 自定义 Chroma 高亮必需 noClasses=false
[markup.highlight]
  noClasses = false

# 允许文章内嵌原生 HTML
[markup.goldmark.renderer]
  unsafe = true

# ===========================================================================
# 主题参数
# ===========================================================================
[params]
  # 首页展示的内容目录名
  contentTypeName = "posts"
  # 顶部菜单直接显示的条数(超出折叠为"展开")
  showMenuItems = 3
  # 全屏宽度
  fullWidthTheme = false
  # 居中布局
  centerTheme = true
  # 自动用 resource 目录下的 cover.(jpg|png|webp) 作为封面
  autoCover = true
  # 显示文章最后更新时间(配合 CI 的 fetch-depth:0)
  showLastUpdated = true
  updatedDatePrefix = "更新于"
  # 目录
  Toc = true
  TocTitle = "目录"
  # 阅读时间
  readingTime = true
  # 日期格式
  dateFormat = "2006-01-02"

# ===========================================================================
# 中文语言
# ===========================================================================
[languages]
  [languages.zh-cn]
    label = "简体中文"
    title = "Hongwei's Blog"
    weight = 1

    [languages.zh-cn.params]
      subtitle = "记录编程、学习与思考"
      owner = "Hongwei"
      keywords = "编程, 技术, 博客, Spring, AI"
      copyright = ""
      menuMore = "展开"
      readMore = "阅读全文"
      readOtherPosts = "阅读其他文章"
      newerPosts = "较新文章"
      olderPosts = "较早文章"
      missingContentMessage = "页面不存在..."
      missingBackButtonLabel = "返回首页"
      minuteReadingTime = "分钟阅读"
      words = "字"

      [languages.zh-cn.params.logo]
        logoText = "Hongwei's Blog"
        logoHomeLink = "/"

    [languages.zh-cn.menu]
      [[languages.zh-cn.menu.main]]
        identifier = "posts"
        name = "文章"
        url = "/posts"
        weight = 10
      [[languages.zh-cn.menu.main]]
        identifier = "tags"
        name = "标签"
        url = "/tags"
        weight = 20
      [[languages.zh-cn.menu.main]]
        identifier = "categories"
        name = "分类"
        url = "/categories"
        weight = 30
