# ===========================================================================
# 主题外观
# ===========================================================================
colorScheme = "neon"              # 霓虹赛博朋克配色(炫酷首选)
defaultAppearance = "dark"        # 默认暗色(科技感)
autoSwitchAppearance = true       # 跟随系统自动切换明暗

# ===========================================================================
# 首页布局 —— 最炫的「background」布局:背景图 + 模糊 + 霓虹
# ===========================================================================
[homepage]
  layout = "hero"                       # hero 布局:霓虹渐变 + 打字机(无需背景图)
  showRecent = true                     # 显示最新文章
  showRecentItems = 6
  showMoreLink = true
  showMoreLinkDest = "/posts/"
  cardView = true                       # 文章以卡片形式展示
  cardViewScreenWidth = false
  layoutBackgroundBlur = true           # 背景模糊效果(炫酷核心)

# ===========================================================================
# 文章列表样式
# ===========================================================================
[list]
  showBreadcrumbs = true
  summaryLayout = "compact"
  showCards = true                      # 列表用卡片
  showTableOfContents = false
  constrainItemsWidth = false

# ===========================================================================
# 文章页样式
# ===========================================================================
[article]
  showBreadcrumbs = true
  showDate = true
  showDateUpdated = true
  showAuthor = true
  showTableOfContents = true            # 显示目录
  tocOpen = true                        # 默认展开目录
  showReadingTime = true
  showWordCount = true
  showViews = false
  showLikes = false
  showEdit = false
  showHeadingAnchors = true             # 标题锚点(悬停显示 #)
  showPagination = true                 # 上一篇/下一篇
  showRelated = true                    # 相关文章推荐
  invertPagination = false
  sharingLinks = false

# ===========================================================================
# 站点级功能
# ===========================================================================
[header]
  layout = "basic"

[footer]
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true         # 显示明暗切换按钮
  showScrollToTop = true                # 返回顶部按钮

[site]
  showScrollToTop = true

# ===========================================================================
# 杂项
# ===========================================================================
enableSearch = true                     # 全文搜索
enableCodeCopy = true                   # 代码复制按钮
robotsTXT = true
showRelatedItems = 5
