# ===========================================================================
# 代码高亮与 Markdown 渲染
# ===========================================================================
[highlight]
  noClasses = false
  lineNos = false
  style = "github-dark"           # 暗色代码高亮主题(与霓虹配色搭配)

[goldmark]
[goldmark.renderer]
  unsafe = true                   # 允许文章内嵌原生 HTML

[goldmark.parser]
  [goldmark.parser.attribute]
    block = true
