# ===========================================================================
# Hugo + github-style 主题配置
# 主题: https://github.com/MeiK2333/github-style
# ===========================================================================
baseURL = 'https://hongwei6.github.io/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh'
title = "Hongwei's Blog"
theme = 'github-style'
hasCJKLanguage = true
enableRobotsTXT = true
enableEmoji = true
enableGitInfo = true

# 代码高亮(github-style 使用 Pygments 配置)
pygmentsCodeFences = true
pygmentsUseClasses = true

# --- 站点地图 ---
[sitemap]
  changefreq = 'weekly'
  priority = 0.5
  filename = 'sitemap.xml'

# --- 分页 ---
[pagination]
  pagerSize = 10

# --- 分类与标签 ---
[taxonomies]
  category = 'categories'
  tag = 'tags'

# --- 输出格式(启用本地搜索需要 home 输出 json) ---
[outputs]
  home = ['HTML', 'RSS', 'JSON']
  section = ['HTML', 'RSS']

[outputFormats.JSON]
  mediaType = 'application/json'
  baseName = 'index'
  isPlainText = false

# --- 最后修改时间(从 git 历史解析) ---
[frontmatter]
  lastmod = ['lastmod', ':fileModTime', ':default']

# --- Markdown 渲染 ---
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]
  [markup.highlight]
    style = 'github'
    noClasses = false
    lineNos = false
    tabWidth = 4

# ===========================================================================
# 站点参数
# ===========================================================================
[params]
  author = 'Hongwei'
  description = '记录编程、学习与思考'
  github = 'Hongwei6'
  email = ''
  url = 'https://hongwei6.github.io/'
  keywords = 'blog, 编程, Spring AI, Java'
  rss = true
  lastmod = true
  location = 'China'
  userStatusEmoji = '🚀'
  enableSearch = true
  # 自定义样式覆盖(调小正文标题字号、优化中文排版,见 static/css/custom.css)
  custom_css = ['css/custom.css']
  # 使用主题自带的图标资源
  favicon = '/images/github-mark.png'
  avatar = '/images/avatar.png'
  headerIcon = '/images/github-mark-white.png'

  # --- 自定义链接(首页 README 下方的 Link 区块,可按需增减) ---
  [[params.links]]
    title = 'GitHub'
    href = 'https://github.com/Hongwei6'
  [[params.links]]
    title = 'RSS'
    href = '/index.xml'
